name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Required repo settings for deploy (Settings → Secrets and variables → Actions):
#   Variables: AWS_REGION (e.g. us-east-1)
#   Secrets:   AWS_DEPLOY_ROLE_ARN  (IAM role trusted by the GitHub OIDC provider)
# No long-lived AWS access keys are used — auth is via OIDC.

permissions:
  contents: read
  id-token: write   # needed for AWS OIDC federation

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Backend tests ---
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

      # --- Frontend build ---
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build frontend (production)
        working-directory: frontend
        run: npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- Provision / update infrastructure (bundles the Lambda via Docker) ---
      - name: Install infra deps
        working-directory: infra
        run: npm ci
      - name: CDK deploy
        working-directory: infra
        run: npx cdk deploy --require-approval never --outputs-file cdk-outputs.json

      - name: Read stack outputs
        id: outputs
        working-directory: infra
        run: |
          echo "bucket=$(jq -r '.ChromaMindStack.SiteBucketName' cdk-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "dist=$(jq -r '.ChromaMindStack.DistributionId' cdk-outputs.json)" >> "$GITHUB_OUTPUT"

      # --- Build and publish the frontend ---
      - name: Build frontend (production)
        working-directory: frontend
        run: npm ci && npm run build
      - name: Sync to S3
        run: aws s3 sync frontend/dist/ChromaMind "s3://${{ steps.outputs.outputs.bucket }}" --delete
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${{ steps.outputs.outputs.dist }}" --paths '/*'
